services:
  php:
    build:
      context: .
      dockerfile: docker-configs/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: sitepulse-php:latest
    container_name: sitepulse-php
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html:cached
    extra_hosts:
      - host.docker.internal:host-gateway
      - sitepulse-wp.test:host-gateway
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: caddy:2-alpine
    container_name: sitepulse-caddy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-6080}:80"
    volumes:
      - ./docker-configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/var/www/html:cached
    depends_on:
      - php

  redis:
    image: redis:7-alpine
    container_name: sitepulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}

  redisinsight:
    image: redis/redisinsight:latest
    container_name: sitepulse-redisinsight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    depends_on:
      - redis

  mysql:
    image: mysql:8.0
    container_name: sitepulse-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-sitepulse}
      MYSQL_USER: ${DB_USERNAME:-sitepulse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
